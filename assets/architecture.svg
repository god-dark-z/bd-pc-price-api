<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="260" fill="#0b0b0d"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d4af37"/>
    </marker>
  </defs>
  <!-- boxes -->
  <g>
    <rect x="20" y="90" width="150" height="80" rx="10" fill="#151517" stroke="#d4af37" stroke-width="1.5"/>
    <text x="95" y="122" text-anchor="middle" fill="#e8c766" font-size="14" font-weight="bold">27 Retailer Sites</text>
    <text x="95" y="144" text-anchor="middle" fill="#9a9aa0" font-size="11">sitemap-first crawl</text>
    <rect x="210" y="90" width="150" height="80" rx="10" fill="#151517" stroke="#d4af37" stroke-width="1.5"/>
    <text x="285" y="122" text-anchor="middle" fill="#e8c766" font-size="14" font-weight="bold">Daily Refresh</text>
    <text x="285" y="144" text-anchor="middle" fill="#9a9aa0" font-size="11">00:20 Dhaka · scheduled</text>
    <rect x="400" y="90" width="150" height="80" rx="10" fill="#151517" stroke="#d4af37" stroke-width="1.5"/>
    <text x="475" y="122" text-anchor="middle" fill="#e8c766" font-size="14" font-weight="bold">Background Scrape</text>
    <text x="475" y="144" text-anchor="middle" fill="#9a9aa0" font-size="11">15 min · 1 retailer / run</text>
    <rect x="590" y="90" width="130" height="80" rx="10" fill="#1a1a12" stroke="#d4af37" stroke-width="1.5"/>
    <text x="655" y="122" text-anchor="middle" fill="#e8c766" font-size="14" font-weight="bold">Netlify Blobs</text>
    <text x="655" y="144" text-anchor="middle" fill="#9a9aa0" font-size="11">atomic replace</text>
    <rect x="760" y="90" width="120" height="80" rx="10" fill="#151517" stroke="#d4af37" stroke-width="1.5"/>
    <text x="820" y="122" text-anchor="middle" fill="#e8c766" font-size="14" font-weight="bold">JSON API</text>
    <text x="820" y="144" text-anchor="middle" fill="#9a9aa0" font-size="11">/api/search …</text>
  </g>
  <!-- arrows -->
  <g stroke="#d4af37" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="170" y1="130" x2="206" y2="130"/>
    <line x1="360" y1="130" x2="396" y2="130"/>
    <line x1="550" y1="130" x2="586" y2="130"/>
    <line x1="720" y1="130" x2="756" y2="130"/>
  </g>
  <text x="450" y="40" text-anchor="middle" fill="#d4af37" font-size="15" font-weight="bold" letter-spacing="2">HOW IT WORKS</text>
  <text x="450" y="215" text-anchor="middle" fill="#9a9aa0" font-size="12">Stored data only — the API never scrapes live. Failed retailer? Yesterday's data stays.</text>
</svg>
